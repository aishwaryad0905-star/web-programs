<!DOCTYPE html>
<html>
<head>
    <title>jQuery Lab Program</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf2f8;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: darkblue;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 15px auto;
            width: 80%;
            border-radius: 10px;
        }

        button {
            background-color: steelblue;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        #animateBox {
            width: 100px;
            height: 100px;
            background-color: orange;
            position: relative;
            margin: 20px auto;
        }

        #colorBox {
            width: 100px;
            height: 100px;
            background-color: green;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1>jQuery Web Lab Program</h1>

<div class="box">
    <h2>1. Append Content</h2>

    <p id="para">Welcome to jQuery</p>

    <button id="appendPara">Append Paragraph</button>

    <ul id="myList">
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <button id="appendList">Append List Item</button>
</div>

<div class="box">
    <h2>2. Animate Element</h2>

    <div id="animateBox"></div>

    <button id="animateBtn">Animate</button>
</div>

<div class="box">
    <h2>3. Change Color of Div</h2>

    <div id="colorBox"></div>

    <button id="colorBtn">Change Color</button>
</div>

<script>

$(document).ready(function() {

    // 1. Append paragraph content
    $("#appendPara").click(function() {
        $("#para").append(" - Learning jQuery!");
    });

    // Append list item
    $("#appendList").click(function() {
        $("#myList").append("<li>JavaScript</li>");
    });

    // 2. Animate element
    $("#animateBtn").click(function() {
        $("#animateBox").animate({
            left: "100px",
            width: "150px",
            height: "150px"
        });
    });

    // 3. Change color of div
    $("#colorBtn").click(function() {
        $("#colorBox").animate({
            width: "200px",
            height: "150px",
            opacity: 0.5
        }, 1000, function() {
            $(this).css("background-color", "red");
        });
    });

});

</script>

</body>
</html>
